# Configuration du proxy Vaultaire.
#
# Ce fichier est DÉPLOYABLE TEL QUEL sur plusieurs hôtes : il ne contient aucune
# identité. Chaque proxy s'enrôle au premier démarrage et écrit la sienne dans
# <keys>/client_software.yaml.

# Cores à joindre, essayés dans l'ordre. Le premier qui répond gagne.
servers:
  - ip: "10.0.0.1"
    port: 6666

enrollment:
  # Clé d'enrôlement de type vaultaire_proxy, créée sur le core :
  #   vlt enroll create --type vaultaire_proxy --uses 5 --expires 24h
  #
  # Elle porte le TYPE du client : c'est elle qui décide de ce que le core
  # laissera ce proxy émettre. Le proxy ne peut pas déclarer son type lui-même —
  # sinon il suffirait de s'enrôler pour se donner les privilèges qu'on veut.
  #
  # Lue au PREMIER démarrage seulement. Une fois l'identité écrite, elle ne sert
  # plus et peut être retirée du fichier.
  key: "CHANGEZ-MOI"

  # Nom lisible côté core, pour les journaux et l'affichage. Aucune valeur de
  # sécurité : il n'entre dans aucune décision.
  label: "proxy-preprod-01"

# --- Relais (2.2) -------------------------------------------------------------
#
# Le proxy TRANSPORTE des connexions sans les lire : il ne termine ni la session
# Ducky ni TLS. Sans section « relais », un seul relais Ducky vers les cores, sur
# le port annoncé au cluster (-listen-port) — c'est le cas courant.
#
# Types : ducky (actif) ; https, ldap, ldaps (prévus, refusés au démarrage tant
# qu'ils ne sont pas activés — TO-DO 72). Voir docs/proxy/relais.md.
#
# relais:
#   - nom: ducky
#     type: ducky
#     ecoute: ":6666"            # doit être le port de -listen-port
#     cibles:
#       source: cores            # cores du cluster (04_04), puis « servers » ci-dessus
#     # delai_connexion_secondes: 3
#     # inactivite_secondes: 900
#     # max_connexions: 4000
#     # max_par_source: 20
#
#   # Relais vers une liste fixe (tests, cœur de site dédié) :
#   # - nom: ducky-site
#   #   type: ducky
#   #   ecoute: ":6666"
#   #   cibles:
#   #     source: liste
#   #     adresses: ["10.0.0.10:6666", "10.0.0.11:6666"]
#
#   # PRÉVU — relais HTTPS vers les dépôts Nexus du cluster :
#   # - nom: nexus
#   #   type: https
#   #   ecoute: ":8843"
#   #   cibles:
#   #     source: "service:vaultaire_nexus"
