serveurlistenport: "6666"

file-path:
  socketpath: "/opt/vaultaire/vaultaire.sock"
  # Les chemins de clés (privatekeypath, publickeypath, privatekeyforlogintoclient, publickeyforlogintoclient)
  # ne sont plus nécessaires - toutes les clés et certificats sont maintenant stockés en base de données
  clientconfpath: "/opt/vaultaire/"
  logpath: "/var/log/vaultaire/"
  # servercheckonlinetimer : RETIRÉ — n'est plus lu.
  #
  # La cadence de vérification des machines en ligne est un réglage
  # d'exploitation, pas une propriété d'installation. Elle vit en base :
  #
  #   vlt settings list
  #   vlt settings set check_online_minutes 2
  #
  # Un changement y prend effet au tour suivant, sans redémarrer le core —
  # c'est-à-dire sans couper le parc pour ajuster une période.
  #
  # Une ligne laissée ici produit un avertissement au démarrage plutôt que
  # d'être ignorée en silence.

ldap:
  ldap_enable: true
  ldaps_enable: true
  ldap_port: 389
  ldaps_port: 636

  # Second facteur au bind LDAP.
  #
  # Par défaut (false), un compte dont le second facteur est posé — ou imposé
  # par un de ses groupes — se lie avec son mot de passe SUIVI du code à 6
  # chiffres : « MonMotDePasse123456 ». Un compte imposé mais pas encore enrôlé
  # est refusé.
  #
  # true laisse ces comptes se lier avec le seul mot de passe, pour des
  # applications incapables de transmettre le code. Chaque bind concerné est
  # journalisé (SECURITY). Préférez des comptes de service hors des groupes
  # soumis au second facteur.
  mfa_bypass: false

  # Noms et adresses que le certificat LDAPS doit couvrir.
  #
  # Le nom de la machine et ses adresses sont détectés automatiquement. Ne
  # déclarez ici que ce qui ne peut PAS l'être : nom de service DNS, nom de
  # conteneur, alias derrière un répartiteur.
  #
  # Les clients Java — Keycloak, connecteurs JNDI — ignorent le CommonName
  # depuis JDK 9 et exigent un SAN correspondant au nom de l'URL. Un nom absent
  # d'ici échoue avec « SSLHandshakeFailed », sans autre indice.
  #
  # Mettez le nom court ET le nom qualifié : un SAN ne se compare pas par
  # suffixe. « vaultaire-ad » ne couvre pas « vaultaire-ad.interne.lan ».
  #
  # Après modification : vlt certificate regenerate ldaps, puis redémarrage.
  # Voir docs/exploitation/ldaps_keycloak.md
  # Élargir une recherche « one » à toute l'arborescence.
  #
  # Par défaut (false), une recherche de portée « one » rend UN niveau, comme le
  # veut la RFC 4511. C'est un changement de la 2.2 : le serveur promouvait
  # silencieusement en « sub » toute recherche « one » dont le conteneur
  # s'appelait « users ».
  #
  # true rétablit l'ancien comportement, pour TOUTE recherche « one » et non plus
  # selon le nom du conteneur. Utile si un client attend les sous-domaines sans
  # savoir demander « sub » — JumpServer est dans ce cas. Préférez, quand c'est
  # possible, reconfigurer le client en « scope=sub » : c'est la façon juste de
  # demander une arborescence.
  onelevel_subtree: false

  # Refuser un bind avec mot de passe sur le port en clair.
  #
  # Par défaut (false), un bind est accepté sur 389 comme sur 636. Sur 389, le
  # mot de passe traverse le réseau en clair.
  #
  # true refuse tout bind avec mot de passe hors TLS (strongerAuthRequired) : le
  # client doit se lier en LDAPS, sur 636. Les recherches sans bind — RootDSE,
  # sous-schéma — restent servies sur 389.
  #
  # À n'activer qu'après avoir vérifié que TOUS les clients savent faire du
  # LDAPS : l'activer coupe aussitôt ceux qui sont configurés sur 389. Les
  # lignes « ouverte LDAP depuis … » du journal disent lesquels le sont encore.
  require_tls_for_bind: false

  # Bornes de recherche et de pagination.
  #
  # Les valeurs ci-dessous sont celles du code : cette section ne change rien
  # tant qu'on n'y touche pas. Elles conviennent à un annuaire de quelques
  # dizaines de milliers d'entrées.
  #
  # AUCUNE borne ne se désactive d'ici : zéro, une valeur négative ou un ordre
  # de grandeur aberrant ARRÊTENT le démarrage, en nommant la clé. Une clé mal
  # orthographiée aussi. Comment les choisir, et ce que coûte une entrée tenue
  # en mémoire : docs/exploitation/ldap_bornes.md
  limites:
    # Entrées qu'une recherche NON paginée peut rendre (1 à 1 000 000). Au-delà,
    # le client reçoit sizeLimitExceeded : il doit paginer.
    max_search_entries: 10000
    # Temps laissé à l'envoi d'une réponse, en secondes (1 à 3600).
    max_search_duration_seconds: 30
    # Taille maximale d'une page (1 à 100 000). Le client propose, le serveur
    # peut rendre moins.
    max_page_size: 1000
    # Entrées qu'UNE recherche paginée peut rendre, toutes pages confondues
    # (1 à 10 000 000). Jamais moins que max_search_entries.
    max_paged_search_entries: 200000
    # Entrées tenues en mémoire par TOUTES les recherches paginées en cours
    # (1 à 50 000 000). Au-delà, une nouvelle recherche paginée reçoit « busy ».
    # Jamais moins que max_paged_search_entries.
    max_paged_entries_held: 500000
    # Recherches paginées ouvertes en même temps sur une connexion (1 à 64).
    max_paged_cursors_per_connection: 4
    # Temps laissé au client pour demander la page suivante, en secondes
    # (10 à 86 400). Passé ce délai, la recherche est à refaire.
    paged_cursor_ttl_seconds: 300

  ldaps_tls_dns_names: []
  #  - vaultaire-ad
  #  - vaultaire-ad.interne.lan
  ldaps_tls_ip_addresses: []
  #  - 10.0.0.10

dns:
  dns_enable: true

database:
  username: root
  # REMPLACEZ CETTE VALEUR. Le marqueur ne fonctionne pas : c'est voulu.
  # Un fichier livré avec un mot de passe QUI MARCHE est un mot de passe publié
  # dans le dépôt Git du produit, et il reste en place sur toute installation
  # que personne n'a retouchée.
  password: CHANGEZ_MOI
  ip_database: "vaultaire-db"
  port_database: "3306"
  databaseName: "vaultaire"

website:
  website_enable: true
  website_port: 4443
  # Noms et adresses que le certificat du portail web et de l'API REST doit
  # couvrir, en plus du nom de la machine et de ses adresses, détectés seuls.
  #
  # Un certificat qui ne porte pas le nom saisi dans le navigateur est rejeté
  # (ERR_CERT_COMMON_NAME_INVALID), et le CommonName n'y change rien : il est
  # ignoré depuis Chrome 58 et le JDK 9. Seuls ces SAN comptent.
  #
  # Distincts de ceux du LDAPS : ces services ne sont pas joints par les mêmes
  # noms — le portail par une URL en signet, l'annuaire par un alias de service.
  #
  # Après modification, régénérer le certificat et redémarrer.
  web_tls_dns_names: []
  #  - sso.interne.lan
  #  - vaultaire.exemple.fr
  web_tls_ip_addresses: []
  #  - 10.0.0.10

  # Relais autorisés à déclarer l'adresse réelle du client, en adresses simples
  # ou en préfixes CIDR.
  #
  # VIDE = l'en-tête X-Forwarded-For est IGNORÉ, et c'est l'adresse du pair TCP
  # qui identifie la source pour la limitation des tentatives d'authentification.
  # C'est le bon réglage quand le portail est joint directement.
  #
  # Le croire sans l'avoir demandé serait pire que de ne rien limiter : cet
  # en-tête est écrit par le client, donc une valeur différente à chaque
  # tentative lui donnerait un compteur neuf à chaque coup — et lui permettrait
  # d'y mettre l'adresse d'un collègue pour la faire pénaliser à sa place.
  #
  # À renseigner SI le portail est publié derrière un reverse proxy ou un
  # répartiteur de charge : sans cela toutes les requêtes portent l'adresse du
  # relais, la limitation par source devient globale, et le premier balayage venu
  # freine tout le monde.
  web_trusted_proxies: []
  #  - 10.0.0.5
  #  - 192.168.10.0/24

automatisation:
  sh_folder_path: "/opt/vaultaire/automatisation/"

api:
  api_enable: true
  api_port: 6643
  # Débit par adresse source sur /api/command, appliqué AVANT toute
  # authentification : l'authentification de l'API EST la signature, et la
  # vérifier coûte au core deux lectures en base et un calcul par clé du compte
  # visé. Un seau de « limite_rafale » requêtes, rempli de « limite_par_seconde »
  # par seconde : un script qui envoie cent commandes d'un coup passe, un flot
  # soutenu est ramené au débit de remplissage. Au-delà : 429 et Retry-After.
  # Derrière un relais, voir web_trusted_proxies : sans lui toutes les requêtes
  # portent l'adresse du relais et partagent un seul seau.
  limite_rafale: 100
  limite_par_seconde: 20

debug:
  # FAUX par défaut. Les lignes DEBUG portent les DN des binds LDAP, les
  # identifiants de groupe des décisions de permission et le détail des
  # vérifications de signature : aucun secret, mais la cartographie complète de
  # l'annuaire et des droits, dans un fichier lisible localement et sans
  # bornage. À n'activer que le temps d'un diagnostic.
  debug: false

  # Détail par sous-système : ldap, ducky, gpo, base.
  #
  # Chaque sous-système suit « debug » ci-dessus, sauf s'il est réglé ici :
  #
  #   off     n'écrit rien sous INFO, même avec debug: true
  #   debug   écrit ses lignes DEBUG, même avec debug: false
  #   trace   DEBUG, plus le déroulé pas à pas
  #
  # Deux usages : le debug partout SAUF l'annuaire (debug: true, ldap: off) —
  # un client LDAP bavard noie sinon tout le reste —, ou l'annuaire SEUL
  # (debug: false, ldap: debug).
  #
  # En « debug », l'annuaire écrit UNE ligne par opération : connexion, message,
  # demande, code de résultat, nombre d'entrées, durée. « trace » y ajoute les
  # paquets reçus et le CONTENU des entrées rendues : à réserver à un
  # diagnostic, sur un core dont le journal n'est lu par personne d'autre.
  #
  # Se règle aussi à chaud, sans redémarrer : vlt update -debug ldap trace
  # (jusqu'au redémarrage du core). Un nom ou un niveau inconnu arrête le
  # démarrage. Voir docs/Developement/how it work/Journalisation.md
  detail: {}
  #  ldap: debug
  #  ducky: off

# « administrateur » et non « administreur ».
#
# L'ancienne orthographe n'a JAMAIS été lue : l'étiquette de la structure Go dit
# « administrateur », et un décodeur YAML apparie sur l'étiquette exacte. Toute
# cette section était donc ignorée en silence, et le compte d'amorçage naissait
# avec les valeurs par défaut du code quoi que contienne ce fichier.
# Le core refuse maintenant de démarrer sur l'ancienne clé, en la nommant.
administrateur:
  enable: true
  username: admin
  # REMPLACEZ CETTE VALEUR, le core refuse de démarrer tant qu'elle est là.
  # Ce compte entre dans le groupe « vaultaire » : tous les droits, sur tous les
  # domaines. Son mot de passe est PROVISOIRE — il devra être changé sur le
  # portail à la première connexion — et doit tenir la règle de robustesse
  # (12 caractères par défaut, « vlt mfa policy »).
  password: CHANGEZ_MOI
  public_key: "ssh-rsa  root@NTFS"