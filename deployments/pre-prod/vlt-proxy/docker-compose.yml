version: '3.8'

# Proxy Vaultaire — pile autonome.
#
# Le binaire vient de cmd/vaultaire_proxy/, produit par auto-compil.sh. Rien
# n'est compilé ici.
#
#   ./auto-compil.sh
#   cp .env.example .env   puis le renseigner
#   docker compose up -d
#
# Mise à jour :  ./auto-compil.sh && docker compose restart vlt-proxy

networks:
  # externe: true suppose que le core tourne sur la même machine. Sur une
  # machine distincte — le cas normal pour un proxy —, commentez ce bloc,
  # décommentez celui du dessous, et donnez à VAULTAIRE_IP_CORE l'adresse
  # routable du core.
  Ducky-network:
    external: true
    name: pre-prod_Ducky-network

  # proxy-network:
  #   driver: bridge

volumes:
  # Ce volume porte l'IDENTITÉ du proxy : clé privée, clé publique du core,
  # identifiant attribué à l'enrôlement.
  #
  # `docker compose down -v` force un réenrôlement et consomme une place de la
  # clé d'enrôlement. Répété, il épuise le quota et laisse le proxy dehors, avec
  # un message qui ne dit pas que la cause est là.
  vlt_proxy_keys:

services:
  vlt-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: vlt-proxy:latest
    container_name: vlt-proxy
    restart: unless-stopped

    # Tout se configure par variables. Surtout la clé d'enrôlement, seul secret
    # de la configuration : un config.yaml qui la contient finit par être
    # commité.
    env_file:
      - .env
    environment:
      - TZ=Europe/Paris

    volumes:
      # Binaire, en lecture seule. Le conteneur ne doit pas pouvoir réécrire une
      # source de l'hôte : un binaire modifié depuis l'intérieur serait ensuite
      # committé sans qu'on comprenne d'où il vient.
      - ../../../cmd/vaultaire_proxy:/opt/vaultaire/bin:ro
      # Identité, en écriture. Seul endroit où le proxy écrit.
      - vlt_proxy_keys:/var/lib/vaultaire_proxy/keys
      # Configuration par fichier, si vous la préférez aux variables.
      # - ./config.yaml:/etc/vaultaire_proxy/config.yaml:ro

    # La v1 n'ouvre que des connexions SORTANTES. Les ports d'écoute seront à
    # publier quand la répartition de charge arrivera.
    # ports:
    #   - "389:389"
    #   - "8443:8443"

    networks:
      - Ducky-network

    # stop_grace_period laisse partir la trame de sortie (04_14). Sans elle,
    # Docker tue au bout de 10 s et le cluster affiche en ligne, pendant trois
    # minutes, un proxy volontairement éteint.
    stop_signal: SIGTERM
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
