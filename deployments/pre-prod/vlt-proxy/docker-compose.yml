version: '3.8'

# Proxy Vaultaire — pile autonome.
#
# Séparée du docker-compose.yml du core, et pas seulement par propreté : un proxy
# se déploie sur une AUTRE machine. Le fusionner ferait croire à une pile unique
# et rendrait la séparation moins évidente qu'elle ne doit l'être.
#
# Mise en service :
#
#   1. sur le core :  vlt enroll create --type vaultaire_proxy --uses 5 --expires 24h
#   2. ici :          cp .env.example .env   puis le renseigner
#   3.                docker compose up -d --build
#   4. sur le core :  vlt cluster list    -> le proxy doit être « online »

networks:
  # externe: true suppose que le core tourne sur la même machine et que son
  # réseau existe déjà. Sur une machine distincte — le cas normal —, commentez
  # ce bloc, décommentez celui du dessous, et donnez à VAULTAIRE_IP_CORE
  # l'adresse routable du core.
  Ducky-network:
    external: true
    name: pre-prod_Ducky-network

  # proxy-network:
  #   driver: bridge

volumes:
  # Ce volume porte l'IDENTITÉ du proxy : clé privée, clé publique du core,
  # identifiant machine attribué à l'enrôlement.
  #
  # Le supprimer force un réenrôlement complet et consomme une place de la clé
  # d'enrôlement. Un `docker compose down -v` répété finit par épuiser le quota
  # et laisse le proxy dehors, avec un message qui ne dit pas que la cause est
  # ici.
  vlt_proxy_keys:

services:
  vlt-proxy:
    build:
      # Contexte = racine du dépôt : l'image compile le proxy ET réinstalle son
      # duckynetwork depuis ducky-network-sdk, qui vit en dehors de
      # src/vaultaire_proxy.
      context: ../../..
      dockerfile: deployments/pre-prod/vlt-proxy/Dockerfile
    image: vlt-proxy:latest
    container_name: vlt-proxy
    restart: unless-stopped

    # Tout passe par l'environnement : aucun fichier de configuration n'est
    # nécessaire, et surtout la CLÉ D'ENRÔLEMENT — le seul secret — ne se
    # retrouve pas dans un fichier du dépôt. Un config.yaml contenant une clé
    # valide finit toujours par être commité.
    env_file:
      - .env
    environment:
      - TZ=Europe/Paris

    volumes:
      # Identité, en écriture. C'est le seul endroit où le proxy écrit.
      - vlt_proxy_keys:/var/lib/vaultaire_proxy/keys
      # Configuration par fichier, si vous la préférez aux variables.
      # - ./config.yaml:/etc/vaultaire_proxy/config.yaml:ro

    # La v1 n'ouvre que des connexions SORTANTES vers le core. Les ports
    # d'écoute seront à publier quand la répartition de charge arrivera.
    # ports:
    #   - "389:389"
    #   - "8443:8443"

    networks:
      - Ducky-network

    # stop_grace_period laisse partir la trame de sortie (04_14).
    #
    # Sans elle, Docker envoie SIGKILL au bout de 10 s ; si le proxy n'a pas eu
    # le temps de se désenregistrer, le cluster l'affiche en ligne pendant les
    # trois minutes de la fenêtre de battement de cœur — un arrêt planifié
    # devient indistinguable d'une panne.
    stop_signal: SIGTERM
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
