{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vaultaire.serviceAccountName" . }}
  labels:
    {{- include "vaultaire.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Le core n'appelle pas l'API Kubernetes : aucun jeton monté.
automountServiceAccountToken: false
{{- end }}
