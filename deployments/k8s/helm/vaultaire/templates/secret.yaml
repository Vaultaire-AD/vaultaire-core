{{- include "vaultaire.validate" . -}}
{{- if not .Values.auth.existingSecret }}
# Créé seulement sans auth.existingSecret — pour un essai. En GitOps, fournir
# un Secret géré ailleurs (External Secrets, Sealed Secrets, SOPS).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vaultaire.secretName" . }}
  labels:
    {{- include "vaultaire.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKeys.dbPassword }}: {{ .Values.auth.dbPassword | quote }}
  {{- if .Values.config.admin.enabled }}
  {{ .Values.auth.secretKeys.adminPassword }}: {{ .Values.auth.adminPassword | quote }}
  {{- end }}
  {{- if .Values.mariadb.enabled }}
  {{ .Values.auth.secretKeys.dbRootPassword }}: {{ .Values.auth.dbRootPassword | quote }}
  {{- end }}
  {{- with .Values.auth.adminPublicKey }}
  {{ $.Values.auth.secretKeys.adminPublicKey }}: {{ . | quote }}
  {{- end }}
{{- end }}
