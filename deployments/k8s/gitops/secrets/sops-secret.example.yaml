# Variante SOPS (Flux sait déchiffrer, Argo CD avec le plugin ksops/helm-secrets).
# Écrire en clair, puis chiffrer AVANT tout commit :
#   sops --encrypt --encrypted-regex '^(data|stringData)$' --in-place sops-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: vaultaire-secrets
  namespace: vaultaire
type: Opaque
stringData:
  db-password: A_REMPLACER
  admin-password: A_REMPLACER
  db-root-password: A_REMPLACER
