# External Secrets Operator : le Secret « vaultaire-secrets » est tiré du
# gestionnaire de secrets (Vault, AWS/GCP/Azure, 1Password…). Rien de
# sensible dans le dépôt Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultaire-secrets
  namespace: vaultaire
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: vaultaire-secrets
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef: { key: vaultaire/prod, property: db-password }
    - secretKey: admin-password
      remoteRef: { key: vaultaire/prod, property: admin-password }
    # Avec mariadb.enabled seulement :
    - secretKey: db-root-password
      remoteRef: { key: vaultaire/prod, property: db-root-password }
