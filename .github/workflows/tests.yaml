name: "🧪 Tests — à chaque merge dans dev"

# Ce fichier existe parce que la chaîne d'intégration ne lançait AUCUN test
# (TO-DO 75). L'audit `dev.yaml` vérifie le format, la sécurité et les
# dépendances ; rien ne vérifiait que le code fait ce qu'il promet. C'est ainsi
# que des tests périmés ont vécu des mois : deux décrivaient un hachage
# abandonné, un paquet entier ne compilait plus, cinq paniquaient faute de base.
#
# # Pourquoi seulement `dev`, et pourquoi sur `push`
#
# Un merge dans `dev` se voit ici comme un `push` sur `dev` : c'est le moment où
# le code devient celui que tout le monde récupère, donc le seul où un test
# rouge doit se voir. Pas de déclenchement sur les autres branches — une branche
# de travail a le droit d'être rouge, c'est à cela qu'elle sert —, ni sur
# `pull_request`, ni à heure fixe : un test ne change pas d'issue parce qu'il
# est lundi.
#
# `workflow_dispatch` reste, pour rejouer une exécution à la main. Il ne se
# déclenche jamais seul.

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-dev-${{ github.ref }}
  # PAS d'annulation en cours de route, contrairement à l'audit. Deux merges
  # rapprochés donneraient sinon un seul verdict, et le premier merge
  # resterait sans réponse — or c'est justement celui qu'on cherchera à
  # incriminer quand `dev` cassera.
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.5"

jobs:

  # --------------------------------------------------------------------
  # 1. Quels modules ? La question est posée au dépôt, pas à une liste
  # --------------------------------------------------------------------
  #
  # `dev.yaml` portait une liste écrite à la main : elle citait un module
  # inexistant (`vaultaire_api`) et en oubliait quatre. Une liste à la main
  # diverge, toujours, et son silence ressemble à un succès — le pas était
  # simplement sauté.
  #
  # Ici, la liste est la réponse à « quels dossiers de src/ portent un
  # go.mod ». Un module neuf est couvert le jour où il naît.
  modules:
    name: "🔎 Découverte des modules"
    runs-on: ubuntu-latest
    outputs:
      liste: ${{ steps.decouverte.outputs.liste }}
    steps:
      - uses: actions/checkout@v4

      - name: Lister les modules Go
        id: decouverte
        run: |
          set -euo pipefail
          LISTE=$(find src -mindepth 2 -maxdepth 2 -name go.mod -printf '%h\n' \
                  | sed 's|^src/||' | sort)

          # Zéro module trouvé rendrait une matrice vide, donc un workflow VERT
          # qui n'a rien testé. C'est exactement le défaut que ce fichier
          # corrige : on refuse plutôt que de passer.
          if [ -z "$LISTE" ]; then
            echo "::error::aucun go.mod trouvé sous src/ — la découverte est cassée"
            exit 1
          fi

          echo "Modules couverts :"
          echo "$LISTE" | sed 's/^/  - /'
          echo "liste=$(echo "$LISTE" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------
  # 2. Les tests, un job par module
  # --------------------------------------------------------------------
  tests:
    name: "🧪 ${{ matrix.module }}"
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      # Un module rouge ne doit pas masquer l'état des autres : on veut savoir
      # en une seule exécution ce qui est cassé, pas le découvrir module par
      # module au fil des corrections.
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.modules.outputs.liste) }}
    defaults:
      run:
        working-directory: src/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: src/${{ matrix.module }}/go.sum

      # La compilation d'abord, et séparément : un paquet qui ne compile plus
      # fait échouer `go test` avec un message noyé dans le reste. C'est ce qui
      # est arrivé — un paquet entier muet pendant des mois.
      - name: Compilation
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # `-race` partout, et non « au moins sur le SDK et le proxy ».
      #
      # Une course de données est le défaut qu'un test ne trouve QUE si on le
      # lui demande : elle ne se manifeste ni à tous les tours, ni sur la
      # machine du développeur, et elle se corrige d'autant plus cher qu'elle
      # est découverte tard. Le prix est quelques minutes par exécution, sur un
      # déclenchement qui n'a lieu qu'aux merges dans `dev`.
      - name: go test -race
        run: go test -race ./...

  # --------------------------------------------------------------------
  # 3. Ce que Linux ne peut pas voir
  # --------------------------------------------------------------------
  #
  # L'agent Windows et les collecteurs d'inventaire du socle sont derrière
  # `//go:build windows` : les pas ci-dessus ne les compilent même pas. Sans ce
  # job, on pourrait casser le client Windows sans qu'aucune exécution ne
  # rougisse — et le défaut n'apparaîtrait qu'à la prochaine fabrication
  # d'archive.
  #
  # Compilation croisée seulement : faire tourner ces tests demanderait un
  # exécuteur Windows ou wine, pour un gain bien moindre que « est-ce que cela
  # compile encore ».
  croise-windows:
    name: "🪟 Compilation croisée Windows"
    runs-on: ubuntu-latest
    env:
      GOOS: windows
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Agent Windows
        working-directory: src/vaultaire_client_windows
        run: |
          go build ./...
          go vet ./...

      - name: Socle Ducky, face Windows
        working-directory: src/ducky-network-sdk-service
        run: |
          go build ./...
          go vet ./...

  # --------------------------------------------------------------------
  # 4. La DLL du Credential Provider, éprouvée sous wine (TO-DO 149)
  # --------------------------------------------------------------------
  #
  # Le job précédent compile l'agent Go ; la DLL, elle, est en C++ et n'était
  # fabriquée qu'à la main, par build.sh. Les deux défauts des TO-DO 139 et 140
  # — une dépendance manquante, une inscription sous le CLSID « { » — n'ont été
  # vus qu'à l'écran de connexion d'un vrai Windows Server.
  #
  # Ici : build-cp.sh (imports et formats), puis essai-wine.sh — inscription par
  # regsvr32, GUID sous les deux clés, activation par COM, suite d'appels de
  # LogonUI jouée par un faux LogonUI (agent absent, muet, en marche), trace,
  # retrait. Ce n'est pas LogonUI : la tuile reste une recette manuelle.
  #
  # wine64 et wine seulement, sans architecture i386 : la DLL et le faux
  # LogonUI sont en 64 bits. « bash » devant les scripts : ils sont en 100644
  # dans le dépôt (le clone de travail est sur NTFS).
  credential-provider:
    name: "🪟 Credential Provider sous wine"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/vaultaire_client_windows/credential_provider
    steps:
      - uses: actions/checkout@v4

      - name: mingw-w64 et wine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mingw-w64 wine64 wine
          x86_64-w64-mingw32-g++ --version | head -n1
          wine --version

      - name: Fabrication de la DLL (contrôles des imports et des formats)
        run: bash build-cp.sh build

      - name: Essai sous wine
        run: bash essai-wine.sh build/VaultaireCredentialProvider.dll

  # --------------------------------------------------------------------
  # 5. Les modules natifs, compilés par famille (TO-DO 178)
  # --------------------------------------------------------------------
  #
  # Les modules PAM et la bibliothèque NSS ne se chargent que sur une glibc au
  # moins aussi récente que celle qui les a compilés (TO-DO 173). La release
  # les compile dans les deux familles, chacune sur sa plus ancienne version
  # prise en charge, et auto_compil.sh échoue si un fichier exige davantage.
  #
  # Mais la release ne tourne qu'au passage vers main. Une modification du C
  # qui appellerait une fonction trop récente — une redirection C23 des
  # en-têtes, par exemple, exige glibc 2.38 — ne se verrait qu'au moment de
  # publier. Ici, elle se voit au merge dans dev, avec les MÊMES images, les
  # MÊMES plafonds et la MÊME recette que release.yaml.
  modules-natifs:
    name: "🧩 Modules natifs (${{ matrix.famille }})"
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - famille: rocky
            image: rockylinux:9
            glibc: "2.34"
          - famille: debian
            image: ubuntu:22.04
            glibc: "2.35"
    steps:
      - name: Dépendances de compilation
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y --setopt=install_weak_deps=False gcc binutils pam-devel libxcrypt-devel
          else
            apt-get update -q
            DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
              gcc libc6-dev libpam0g-dev libcrypt-dev binutils
          fi

      - uses: actions/checkout@v4

      - name: Compilation, plafond glibc ${{ matrix.glibc }}
        env:
          VAULTAIRE_GLIBC_MAX: ${{ matrix.glibc }}
        run: bash src/vaultaire_client/pam_module/auto_compil.sh "dist/${{ matrix.famille }}"

  # --------------------------------------------------------------------
  # 6. Le verdict
  # --------------------------------------------------------------------
  #
  # Un seul job à exiger dans les règles de protection de branche : la liste
  # des modules change, celle-ci non.
  verdict:
    name: "📊 Verdict des tests"
    runs-on: ubuntu-latest
    if: always()
    needs: [modules, tests, croise-windows, credential-provider, modules-natifs]
    steps:
      - name: Résumé
        run: |
          {
            echo "## 🧪 Tests — merge dans \`dev\`"
            echo ""
            echo "_Commit \`${GITHUB_SHA::7}\` · [exécution $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)_"
            echo ""
            echo "| Contrôle | Résultat |"
            echo "|---|---|"
            echo "| Découverte des modules | ${{ needs.modules.result }} |"
            echo "| Tests (\`go build\`, \`go vet\`, \`go test -race\`) | ${{ needs.tests.result }} |"
            echo "| Compilation croisée Windows | ${{ needs.croise-windows.result }} |"
            echo "| Credential Provider sous wine | ${{ needs.credential-provider.result }} |"
            echo "| Modules natifs, par famille | ${{ needs.modules-natifs.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Échouer si un contrôle a échoué
        if: needs.modules.result != 'success' || needs.tests.result != 'success' || needs.croise-windows.result != 'success' || needs.credential-provider.result != 'success' || needs.modules-natifs.result != 'success'
        run: |
          echo "::error::des tests ont échoué sur dev — voir les jobs ci-dessus"
          exit 1